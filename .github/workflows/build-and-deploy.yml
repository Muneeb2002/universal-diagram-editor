name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy-server:
    name: Build and Deploy Server to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Yarn (Corepack)
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version


      - name: Install server dependencies
        working-directory: ./glsp-server
        run: yarn install --frozen-lockfile

      - name: Build server
        working-directory: ./glsp-server
        run: yarn build

      - name: Build server bundle
        working-directory: ./glsp-server/universal-editor-server
        run: yarn build

      - name: Create deployment package
        working-directory: ./glsp-server
        run: |
          tar -czf universal-editor-server-bundled.tar.gz universal-editor-server-bundled/

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 and start server
        run: |
          DEPLOY_PATH="${{ secrets.EC2_DEPLOY_PATH || '/opt/glsp-server' }}"
          EC2_USER="${{ secrets.EC2_USER || 'ec2-user' }}"
          EC2_HOST="${{ secrets.EC2_HOST }}"

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ./glsp-server/universal-editor-server-bundled.tar.gz \
            ${EC2_USER}@${EC2_HOST}:/tmp/universal-editor-server-bundled.tar.gz

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ./scripts/deploy-server.sh \
            ${EC2_USER}@${EC2_HOST}:/tmp/deploy-server.sh

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${EC2_USER}@${EC2_HOST} \
            "set -e
             sudo mkdir -p '${DEPLOY_PATH}'
             sudo chown '${EC2_USER}:${EC2_USER}' '${DEPLOY_PATH}'
             sudo mv /tmp/universal-editor-server-bundled.tar.gz '${DEPLOY_PATH}/universal-editor-server-bundled.tar.gz'
             sudo chown '${EC2_USER}:${EC2_USER}' '${DEPLOY_PATH}/universal-editor-server-bundled.tar.gz'
             chmod +x /tmp/deploy-server.sh
             /tmp/deploy-server.sh '${DEPLOY_PATH}'
             rm /tmp/deploy-server.sh"


      

  build-and-deploy-client:
    name: Build and Deploy Client to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Yarn (Corepack)
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install client dependencies
        working-directory: ./glsp-client
        run: yarn install --frozen-lockfile

      - name: Build client packages
        working-directory: ./glsp-client
        run: yarn build

      - name: Build client standalone
        working-directory: ./glsp-client/universal-editor-standalone
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GLSP_SERVER_HOST: 'server.universaldiagrameditor.me'
          GLSP_SERVER_PORT: '443'
        run: yarn build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './glsp-client/universal-editor-standalone/app'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

